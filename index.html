<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Alu Pinball</title>
<style>
  :root {
    --bg: #05070b;
    --panel: #0d131c;
    --line: #1f2a38;
    --amber: #ffab3d;
    --amber-dim: #6b4413;
    --cyan: #6fd3ff;
    --text: #d9e2ec;
    --muted: #7d8b9c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #hud {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    max-width: 640px; margin: 0 auto; padding: 6px 16px;
    font-family: "Consolas", "Courier New", monospace;
  }
  .hud-box { min-width: 70px; }
  .hud-box.r { text-align: right; }
  .lbl { font-size: 11px; letter-spacing: 2px; color: var(--muted); }
  .val { font-size: 18px; color: var(--amber); text-shadow: 0 0 8px rgba(255,171,61,.6); }
  #hud-score {
    font-size: 30px; font-weight: 700; color: var(--amber); text-align: center;
    text-shadow: 0 0 10px rgba(255,171,61,.8); letter-spacing: 1px; line-height: 1.1;
  }
  #hud-info { font-size: 12px; color: var(--cyan); text-align: center; min-height: 16px; letter-spacing: 1px; }
  #mute {
    background: none; border: 1px solid var(--line); color: var(--text); border-radius: 6px;
    font-size: 16px; padding: 4px 8px; cursor: pointer;
  }
  #wrap { position: relative; display: flex; justify-content: center; }
  canvas { display: block; border-radius: 10px; box-shadow: 0 0 40px rgba(111,211,255,.12); }
  #overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  #overlay .card {
    pointer-events: auto; width: min(420px, calc(100% - 32px));
    background: rgba(9,13,20,.93); border: 1px solid var(--line); border-radius: 14px;
    padding: 22px 22px 18px; text-align: center; box-shadow: 0 10px 50px rgba(0,0,0,.6);
  }
  .card h1 {
    margin: 0; font-size: 34px; letter-spacing: 3px; color: var(--amber);
    text-shadow: 0 0 14px rgba(255,171,61,.7); font-family: "Arial Black", Impact, sans-serif;
  }
  .card .sub { color: var(--cyan); letter-spacing: 2px; font-size: 13px; margin: 4px 0 14px; }
  .card table { width: 100%; font-size: 13px; border-collapse: collapse; margin: 8px 0 12px; }
  .card td { padding: 3px 4px; text-align: left; color: var(--text); }
  .card td.k { color: var(--amber); font-family: Consolas, monospace; white-space: nowrap; }
  .card .hs { font-family: Consolas, monospace; font-size: 14px; margin: 6px 0 14px; }
  .card .hs div { display: flex; justify-content: space-between; padding: 2px 30px; }
  .card .hs div span:last-child { color: var(--amber); }
  .card h2 { font-size: 13px; letter-spacing: 3px; color: var(--muted); margin: 10px 0 4px; font-weight: 600; }
  .card button {
    background: var(--amber); color: #1a0e00; border: 0; border-radius: 8px;
    font-size: 16px; font-weight: 800; letter-spacing: 2px; padding: 11px 28px; cursor: pointer;
    box-shadow: 0 0 18px rgba(255,171,61,.5);
  }
  .card input {
    font-size: 18px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: #05070b; color: var(--amber); text-align: center; width: 70%; margin-bottom: 12px;
    font-family: Consolas, monospace; letter-spacing: 2px; text-transform: uppercase;
  }
  .card .big { font-size: 30px; color: var(--amber); font-family: Consolas, monospace; margin: 6px 0 10px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 10px; }
</style>
</head>
<body>
  <div id="hud">
    <div class="hud-box"><div class="lbl">ŽOGA</div><div class="val" id="hud-ball">-</div></div>
    <div><div id="hud-score">0</div><div id="hud-info"></div></div>
    <div class="hud-box r"><div class="lbl">REKORD</div><div class="val" id="hud-hs">0</div></div>
    <button id="mute" title="Zvok (tipka O)">🔊</button>
  </div>
  <div id="wrap">
    <canvas id="game"></canvas>
    <div id="overlay"></div>
  </div>
  <script src="game.js"></script>
</body>
</html>
